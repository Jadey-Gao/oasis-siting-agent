<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 575" width="1500" height="575" role="img" aria-label="Diagram of the siting-run skill's five stages in sequence: assess the data, prepare the decisions, run the analysis, review the figures, and put the plan to the officer. A decision register at top receives one row from Stage 1 and two rows from Stage 2, plus budget from the operator; a separate GATE box represents the runtime check siting.cli performs against that register before Stage 3 can start. Only the third stage hands off to the L1 through L7 siting.cli subprocess, drawn small and nested inside it. Stages four and five feed back into stage three's re-run. A harness footer at the bottom states the guarantees that hold regardless of the decisions taken, extending the NORA framework for autonomous research agents.">

  <rect x="0" y="0" width="1500" height="575" fill="#F5F3EE"/>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1C1B18"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#46586A"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A85B12"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#276B67"/>
    </marker>
  </defs>

  <text x="20" y="16" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" letter-spacing="1.5" fill="#6E6B62">SKILLS/SITING-RUN/SKILL.MD — FIVE STAGES, ONE ORCHESTRATOR</text>

  <!-- ============ the decision register: what Stage 1 and Stage 2 write into ============ -->
  <rect x="20" y="20" width="470" height="96" rx="8" fill="#FFFFFF" stroke="#46586A" stroke-width="1.5"/>
  <text x="36" y="40" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" font-size="13" fill="#1C1B18">DECISION REGISTER</text>
  <text x="454" y="40" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#6E6B62">siting/decisions.py</text>
  <line x1="36" y1="48" x2="454" y2="48" stroke="#CFCABC" stroke-width="1"/>
  <text x="36" y="64" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#1C1B18">data_currency_accepted</text>
  <text x="454" y="64" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="9" fill="#276B67">Stage 1</text>
  <text x="36" y="82" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#1C1B18">service_radius_m · objective</text>
  <text x="454" y="82" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="9" fill="#276B67">Stage 2</text>
  <text x="36" y="100" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#1C1B18">budget</text>
  <text x="454" y="100" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#6E6B62">operator, upfront</text>

  <!-- Stage 1 / Stage 2 write into the register — checkpoint sits on the arrow, not off to the side -->
  <path d="M130,170 L130,116" stroke="#A85B12" stroke-width="1.5" fill="none" marker-end="url(#arrow-amber)"/>
  <rect x="123" y="139" width="14" height="14" fill="#A85B12" transform="rotate(45 130 146)"/>
  <path d="M380,170 L380,116" stroke="#A85B12" stroke-width="1.5" fill="none" marker-end="url(#arrow-amber)"/>
  <rect x="373" y="139" width="14" height="14" fill="#A85B12" transform="rotate(45 380 146)"/>

  <!-- ============ the gate: the runtime check siting.cli performs on the register at Stage 3 startup ============ -->
  <rect x="440" y="126" width="130" height="36" rx="18" fill="none" stroke="#A85B12" stroke-width="1.5"/>
  <text x="505" y="142" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" font-size="11" fill="#A85B12">GATE</text>
  <text x="505" y="155" text-anchor="middle" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#A85B12">refuses if incomplete</text>
  <path d="M470,116 L500,126" stroke="#A85B12" stroke-width="1.4" fill="none" marker-end="url(#arrow-amber)"/>
  <path d="M505,162 L560,170" stroke="#A85B12" stroke-width="1.6" fill="none" marker-end="url(#arrow-amber)"/>

  <!-- override review — unrelated to the register; still a plain checkpoint above Stage 4 -->
  <g transform="translate(1355,150)">
    <rect x="-7" y="-7" width="14" height="14" fill="#A85B12" transform="rotate(45)"/>
    <line x1="0" y1="7" x2="0" y2="20" stroke="#A85B12" stroke-width="1.3"/>
    <text x="0" y="-13" text-anchor="middle" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#A85B12">checkpoint: override review</text>
  </g>

  <!-- ============ the five stages ============ -->

  <!-- Stage 1 -->
  <rect x="20" y="170" width="220" height="220" rx="9" fill="#276B67" opacity="0.10" stroke="#276B67" stroke-width="1.6"/>
  <text x="36" y="198" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="14" fill="#1C1B18">STAGE 1</text>
  <text x="36" y="216" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#1C1B18">assess the data</text>
  <line x1="36" y1="228" x2="224" y2="228" stroke="#CFCABC" stroke-width="1"/>
  <text x="36" y="252" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="14" fill="#1C1B18">data-scout</text>
  <text x="36" y="270" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#276B67">Read · Bash · Grep</text>
  <text x="36" y="292" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#6E6B62">holdings · age · reachability</text>

  <!-- Stage 2 -->
  <rect x="270" y="170" width="220" height="220" rx="9" fill="#276B67" opacity="0.10" stroke="#276B67" stroke-width="1.6"/>
  <text x="286" y="198" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="14" fill="#1C1B18">STAGE 2</text>
  <text x="286" y="216" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#1C1B18">prepare the decisions</text>
  <line x1="286" y1="228" x2="474" y2="228" stroke="#CFCABC" stroke-width="1"/>
  <text x="286" y="252" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="14" fill="#1C1B18">spatial-analyst</text>
  <text x="286" y="270" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#276B67">Read · Bash · Grep</text>
  <text x="286" y="292" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#6E6B62">priced options + a recommendation</text>

  <!-- Stage 3 (hosts the L1–L7 subprocess, nested and small) -->
  <rect x="520" y="170" width="440" height="220" rx="9" fill="#46586A" opacity="0.06" stroke="#46586A" stroke-width="1.6"/>
  <text x="536" y="194" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="14" fill="#1C1B18">STAGE 3</text>
  <text x="536" y="212" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#1C1B18">run the analysis</text>
  <text x="536" y="226" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#46586A">python -m siting.cli — one subprocess call</text>
  <line x1="536" y1="234" x2="944" y2="234" stroke="#CFCABC" stroke-width="1"/>

  <!-- nested L1–L7 + SCORE strip -->
  <g font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif">
    <rect x="536" y="246" width="44" height="52" rx="5" fill="#DCE3E8" stroke="#46586A" stroke-width="1.2"/>
    <text x="558" y="277" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="12" fill="#46586A">L1</text>

    <rect x="588" y="246" width="44" height="52" rx="5" fill="#DCE3E8" stroke="#46586A" stroke-width="1.2"/>
    <text x="610" y="277" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="12" fill="#46586A">L2</text>

    <rect x="640" y="246" width="44" height="52" rx="5" fill="#DCE3E8" stroke="#46586A" stroke-width="1.2"/>
    <text x="662" y="277" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="12" fill="#46586A">L3</text>

    <rect x="692" y="246" width="44" height="52" rx="5" fill="#F3E2CC" stroke="#A85B12" stroke-width="1.3"/>
    <text x="714" y="277" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="12" fill="#A85B12">L4</text>

    <rect x="744" y="246" width="44" height="52" rx="5" fill="#F3E2CC" stroke="#A85B12" stroke-width="1.3"/>
    <text x="766" y="277" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="12" fill="#A85B12">L5</text>

    <!-- SCORE: not an L-stage, drawn as a hexagon so its shape says so before the label does -->
    <polygon points="796,272 806,246 830,246 840,272 830,298 806,298" fill="#F3E2CC" stroke="#A85B12" stroke-width="1.5"/>
    <text x="818" y="266" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="8.5" fill="#A85B12">SCORE</text>
    <text x="818" y="279" text-anchor="middle" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="6.5" fill="#1C1B18">rules|llm</text>

    <rect x="848" y="246" width="44" height="52" rx="5" fill="#DCE3E8" stroke="#46586A" stroke-width="1.2"/>
    <text x="870" y="277" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="12" fill="#46586A">L6</text>

    <rect x="900" y="246" width="44" height="52" rx="5" fill="#F3E2CC" stroke="#A85B12" stroke-width="1.3"/>
    <text x="922" y="277" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="12" fill="#A85B12">L7</text>
  </g>

  <g stroke="#46586A" stroke-width="1.3" fill="none" marker-end="url(#arrow-slate)" opacity="0.85">
    <path d="M580,272 L588,272"/>
    <path d="M632,272 L640,272"/>
    <path d="M684,272 L692,272"/>
    <path d="M736,272 L744,272"/>
    <path d="M788,272 L796,272"/>
    <path d="M840,272 L848,272"/>
    <path d="M892,272 L900,272"/>
  </g>

  <!-- what fires at each amber chip — no more unlabeled dots -->
  <g font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">
    <text x="558" y="313" font-size="8" fill="#46586A">retrieve</text>
    <text x="610" y="313" font-size="8" fill="#46586A">compile</text>
    <text x="662" y="313" font-size="8" fill="#46586A">solve</text>
    <text x="714" y="313" font-size="8" fill="#A85B12" font-weight="600">guardrail</text>
    <text x="714" y="324" font-size="7" fill="#A85B12">/ override</text>
    <text x="766" y="313" font-size="8" fill="#A85B12" font-weight="600">evaluate</text>
    <text x="766" y="324" font-size="7" fill="#A85B12">equity check</text>
    <text x="818" y="313" font-size="8" fill="#A85B12" font-weight="600">stops</text>
    <text x="818" y="324" font-size="7" fill="#A85B12">below floor</text>
    <text x="870" y="313" font-size="8" fill="#46586A">render</text>
    <text x="922" y="313" font-size="8" fill="#A85B12" font-weight="600">confirm</text>
    <text x="922" y="324" font-size="7" fill="#A85B12">before issue</text>
  </g>

  <text x="740" y="342" text-anchor="middle" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-style="italic" font-size="9" fill="#6E6B62">amber &#61; a harness checkpoint fires here (see HARNESS, below)</text>

  <!-- Stage 3b -->
  <rect x="990" y="170" width="220" height="220" rx="9" fill="none" stroke="#276B67" stroke-width="1.6"/>
  <text x="1006" y="198" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="14" fill="#1C1B18">STAGE 3b</text>
  <text x="1194" y="198" text-anchor="end" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#276B67">&#8635; may repeat</text>
  <text x="1006" y="216" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#1C1B18">figures reviewed</text>
  <line x1="1006" y1="228" x2="1194" y2="228" stroke="#CFCABC" stroke-width="1"/>
  <text x="1006" y="252" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="14" fill="#1C1B18">map-reviewer</text>
  <text x="1006" y="270" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#276B67">Read only</text>
  <rect x="1006" y="282" width="188" height="34" rx="6" fill="#276B67" opacity="0.08" stroke="#276B67" stroke-width="1"/>
  <text x="1016" y="296" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="9" fill="#276B67">LAYER: rendered images</text>
  <text x="1016" y="310" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#6E6B62">figures.json + map_*.png</text>
  <rect x="1006" y="326" width="188" height="24" rx="12" fill="#276B67" opacity="0.12" stroke="#276B67" stroke-width="1.2"/>
  <text x="1100" y="342" text-anchor="middle" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#276B67">accept · revise · unreadable</text>

  <!-- Stage 4 -->
  <rect x="1240" y="170" width="230" height="220" rx="9" fill="none" stroke="#276B67" stroke-width="1.6"/>
  <text x="1256" y="198" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="14" fill="#1C1B18">STAGE 4</text>
  <text x="1256" y="216" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#1C1B18">officer reviews the plan</text>
  <line x1="1256" y1="228" x2="1454" y2="228" stroke="#CFCABC" stroke-width="1"/>
  <text x="1256" y="252" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="14" fill="#1C1B18">plan-reviewer</text>
  <text x="1256" y="270" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#276B67">Read only</text>
  <rect x="1256" y="282" width="188" height="34" rx="6" fill="#276B67" opacity="0.08" stroke="#276B67" stroke-width="1"/>
  <text x="1266" y="296" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="9" fill="#276B67">LAYER: the account</text>
  <text x="1266" y="310" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#6E6B62">results.json</text>
  <text x="1256" y="330" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#1C1B18">VETO · PIN · REWEIGHT · RESCOPE</text>
  <text x="1256" y="345" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-style="italic" font-size="9.5" fill="#6E6B62">reason mandatory</text>

  <!-- forward flow across the five stages -->
  <g stroke="#1C1B18" stroke-width="2" fill="none" marker-end="url(#arrow-ink)">
    <path d="M240,280 L270,280"/>
    <path d="M490,280 L520,280"/>
    <path d="M960,280 L990,280"/>
    <path d="M1210,280 L1240,280"/>
  </g>

  <!-- feedback: stage 3b -> stage 3 (figure-review), lands on L6 — a real loop per SKILL.md: "fix the figure and review again" -->
  <path d="M1100,390 L1100,430 L870,430 L870,390" stroke="#276B67" stroke-width="1.5" fill="none" stroke-dasharray="4 4" marker-end="url(#arrow-teal)"/>
  <text x="985" y="424" text-anchor="middle" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#276B67">&#8635; revise → fix → review again, until accept</text>

  <!-- feedback: stage 4 -> stage 3 (overrides), lands on L4 -->
  <path d="M1355,390 L1355,470 L714,470 L714,390" stroke="#276B67" stroke-width="1.5" fill="none" stroke-dasharray="4 4" marker-end="url(#arrow-teal)"/>
  <text x="1035" y="464" text-anchor="middle" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#276B67">overrides written → --overrides (resumes)</text>

  <!-- ============ HARNESS: not a separate box — a footer the amber checkpoints above tie into ============ -->
  <g stroke="#A85B12" stroke-width="1.3" opacity="0.55">
    <line x1="130" y1="484" x2="130" y2="500"/>
    <line x1="380" y1="484" x2="380" y2="500"/>
    <line x1="800" y1="484" x2="800" y2="500"/>
    <line x1="1355" y1="484" x2="1355" y2="500"/>
  </g>
  <line x1="20" y1="500" x2="1470" y2="500" stroke="#A85B12" stroke-width="1.6"/>

  <text x="20" y="524" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" font-size="16" letter-spacing=".5" fill="#A85B12">HARNESS</text>
  <text x="112" y="524" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#6E6B62">extends NORA, 2026</text>

  <g font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#A85B12">
    <rect x="270" y="509" width="94" height="24" rx="12" fill="none" stroke="#A85B12" stroke-width="1.2"/>
    <text x="317" y="525" text-anchor="middle">no default</text>

    <rect x="378" y="509" width="176" height="24" rx="12" fill="none" stroke="#A85B12" stroke-width="1.2"/>
    <text x="466" y="525" text-anchor="middle">checkpoints gate both modes</text>

    <rect x="568" y="509" width="192" height="24" rx="12" fill="none" stroke="#A85B12" stroke-width="1.2"/>
    <text x="664" y="525" text-anchor="middle">overrides priced, not blocked</text>

    <rect x="774" y="509" width="150" height="24" rx="12" fill="none" stroke="#A85B12" stroke-width="1.2"/>
    <text x="849" y="525" text-anchor="middle">every figure traceable</text>
  </g>

  <text x="20" y="552" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#6E6B62">runs/&lt;run-id&gt;/RUN_RECORD.md carries every stage, retrieval, override and score in one account.</text>

</svg>
