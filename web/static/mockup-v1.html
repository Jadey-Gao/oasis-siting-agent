<!doctype html>
<!--
  A clickable mockup of the interview. Nothing here talks to the backend.

  Its purpose is to settle four questions before any of it is built for real:

    1. what the right-hand column is for, and what stays visible in it always
    2. whether clicking an option submits a decision (it must not) or fills one
    3. where the two top-bar switches — language, detail — are allowed to reach
    4. how a refusal looks, given that a refusal here is the design working

  Every figure below is invented. That is stated on the page, in the loudest
  place available, because a recommendation built on invented data is the one
  thing this repository refuses to produce. A mockup is allowed to; it is only
  allowed to while saying so.

  Served at /static/mockup.html once `uvicorn web.app:app` is running.
-->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Siting Interview Mockup</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@600&display=swap">
<style>
  /* Tokens are index.html's, unchanged, plus three the mockup needs:
     --pend  the "chosen, not yet recorded" state, which must not look like
             the recorded state or the whole point of the card is lost
     --dash  the border of an option no run stands behind
     --deep  the expanded width of the right-hand column */
  :root{
    --ground:#F6F7F4; --surface:#FFF; --sunk:#EDF0EA;
    --ink:#1B211F; --soft:#4A544F; --mute:#78827C;
    --rule:#DCE1D9; --accent:#0F5F5C; --accent-soft:#E2EFEC;
    --amber:#9C551A; --amber-soft:#F6EADC; --flag:#8A3324;
    --pend:#7A5C12; --pend-soft:#F4EFDE; --dash:#C6CDC2;
    --rail:360px;
  }
  :root:not([data-theme="light"]){}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#121614; --surface:#1A201D; --sunk:#161C19;
      --ink:#E6E9E4; --soft:#B3BCB6; --mute:#8B958E;
      --rule:#2C3532; --accent:#5CBDB5; --accent-soft:#17302E;
      --amber:#D89552; --amber-soft:#2C2318; --flag:#D9765F;
      --pend:#D6BC72; --pend-soft:#2A2617; --dash:#3B4440;
    }
  }
  :root[data-theme="dark"]{
    --ground:#121614; --surface:#1A201D; --sunk:#161C19;
    --ink:#E6E9E4; --soft:#B3BCB6; --mute:#8B958E;
    --rule:#2C3532; --accent:#5CBDB5; --accent-soft:#17302E;
    --amber:#D89552; --amber-soft:#2C2318; --flag:#D9765F;
    --pend:#D6BC72; --pend-soft:#2A2617; --dash:#3B4440;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ground);color:var(--ink);
    font:16px/1.65 "Source Sans 3","PingFang SC",-apple-system,BlinkMacSystemFont,sans-serif;
    display:flex;flex-direction:column;overflow:hidden}
  h1,h2,h3{font-family:"Zilla Slab","Noto Serif SC",Georgia,serif;text-wrap:balance}
  button{font:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ---------- top bar ---------- */
  header{border-bottom:1px solid var(--rule);background:var(--surface);flex:none}
  .bar{max-width:1400px;margin:0 auto;padding:10px 20px;display:flex;gap:14px;
    align-items:center;flex-wrap:wrap}
  .who{font-family:"Zilla Slab","Noto Serif SC",Georgia,serif;font-size:17px;font-weight:600}
  /* An empty slot is shown, not hidden. The strip is the cover of the record,
     and a reader should see it being written rather than find it already full. */
  .slot.empty{color:var(--dash);font-weight:400}
  @keyframes fillin{from{background:var(--pend-soft);box-shadow:0 0 0 4px var(--pend-soft)}
                    to{background:none;box-shadow:none}}
  .slot.fill,.chip.fill{animation:fillin 1.1s ease-out}
  .chip.bound{background:var(--accent-soft);color:var(--accent)}
  .chip.bound.env{background:var(--amber-soft);color:var(--amber)}
  .flag.warm{color:var(--accent);border-color:var(--accent)}
  .ledger .pre{font-size:12.5px;color:var(--mute);line-height:1.6}
  .sub{font-size:13.5px;color:var(--mute)}
  .spacer{flex:1}
  .chip{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.05em;
    padding:3px 9px;border-radius:11px;background:var(--sunk);color:var(--mute);white-space:nowrap}
  .chip.on{background:var(--accent-soft);color:var(--accent)}

  /* a switch is two buttons in a trough, not a toggle: the reader should be able
     to see which of the two states is off as well as which is on */
  .switch{display:flex;border:1px solid var(--rule);border-radius:13px;overflow:hidden;
    background:var(--sunk)}
  .switch button{border:0;background:none;color:var(--mute);padding:4px 11px;
    font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.04em}
  .switch button.on{background:var(--surface);color:var(--accent);font-weight:500;
    box-shadow:0 0 0 1px var(--rule)}
  .switch b{display:block;font-weight:inherit}
  .lbl{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--mute)}
  .ghostbtn{border:1px solid var(--rule);background:var(--surface);color:var(--soft);
    border-radius:6px;padding:4px 10px;font-size:12.5px}

  .banner{background:var(--amber-soft);color:var(--amber);font-size:13px;
    padding:7px 20px;border-top:1px solid var(--rule)}
  .banner div{max-width:1400px;margin:0 auto;display:flex;gap:8px;align-items:baseline}
  .banner b{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.09em;
    text-transform:uppercase;flex:none}

  /* ---------- layout ---------- */
  main{flex:1;min-height:0;max-width:1400px;width:100%;margin:0 auto;padding:0 20px;
    display:grid;grid-template-columns:minmax(0,1fr) var(--rail);gap:0}
  .talk{display:flex;flex-direction:column;min-height:0;padding-right:26px}
  #thread{flex:1;overflow-y:auto;padding:22px 0 12px;scroll-behavior:smooth}
  .col{max-width:64ch}

  /* ---------- thread ---------- */
  .turn{margin-bottom:20px}
  .turn.u{margin-left:auto;max-width:52ch}
  .who-label{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--mute);margin-bottom:6px}
  .bub{border:1px solid var(--rule);border-radius:7px;padding:14px 17px;background:var(--surface)}
  .turn.u .bub{background:var(--sunk);border-color:transparent}
  .bub p{margin:0 0 11px}
  .bub p:last-child{margin-bottom:0}
  .verbatim{font-family:"Zilla Slab","Noto Serif SC",Georgia,serif;font-size:16.5px;
    line-height:1.6}
  .said-meta{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}
  .vchip{font-family:"JetBrains Mono",monospace;font-size:11px;padding:2px 8px;
    border-radius:4px;background:var(--accent-soft);color:var(--accent)}
  .tr{font-size:13px;color:var(--mute);font-style:italic;margin-top:8px;
    padding-left:11px;border-left:2px solid var(--rule)}
  .tr b{font-family:"JetBrains Mono",monospace;font-style:normal;font-size:9.5px;
    letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:2px}

  /* the evidence drawer. Closed by default in brief, open in full — the same
     text either way, never a second version of it */
  details.basis{margin-top:11px;border-top:1px dashed var(--rule);padding-top:9px}
  details.basis summary{font-family:"JetBrains Mono",monospace;font-size:11px;
    color:var(--mute);cursor:pointer;list-style:none;letter-spacing:.04em}
  details.basis summary::-webkit-details-marker{display:none}
  details.basis summary::before{content:"▸ ";display:inline-block;transition:transform .12s}
  details.basis[open] summary::before{content:"▾ "}
  .call{display:flex;gap:9px;align-items:baseline;font-family:"JetBrains Mono",monospace;
    font-size:11.5px;color:var(--mute);border-left:2px solid var(--rule);
    padding:3px 0 3px 10px;margin-top:5px}
  .call b{font-weight:500;flex:none;color:var(--soft)}
  .ev{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--mute);
    background:var(--sunk);border-radius:5px;padding:8px 10px;margin-top:8px;
    white-space:pre-wrap;overflow-x:auto}

  /* ---------- an event, not a message ---------- */
  .event{border-left:3px solid var(--accent);background:var(--accent-soft);
    border-radius:0 6px 6px 0;padding:10px 14px;margin-bottom:20px;max-width:56ch}
  .event .h{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--accent);margin-bottom:4px}
  .event .b{font-size:14px;color:var(--soft)}
  .event .b code{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:var(--ink)}

  .notice{border:1px solid var(--amber);background:var(--amber-soft);border-radius:7px;
    padding:13px 16px;margin-bottom:20px;max-width:60ch}
  .notice .h{font-family:"Zilla Slab","Noto Serif SC",Georgia,serif;font-weight:600;
    font-size:16px;color:var(--amber);margin-bottom:5px}
  .notice .b{font-size:14.5px;color:var(--soft)}
  .notice ul{margin:9px 0 0;padding-left:18px;font-size:14px;color:var(--soft)}
  .notice li{margin-bottom:3px}
  .notice li code{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:var(--amber)}

  .thinking{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--mute);
    padding:4px 0 20px 12px;border-left:2px solid var(--accent-soft)}

  /* ---------- the card ---------- */
  .card{border:1px solid var(--rule);border-radius:8px;background:var(--surface);
    margin:0 0 20px;max-width:64ch;overflow:hidden}
  .card .top{padding:14px 17px 0}
  .card .pos{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--mute);margin-bottom:5px}
  .card h3{margin:0 0 8px;font-size:19px;line-height:1.35}
  .card details.why{margin-bottom:13px}
  .card details.why summary{font-size:14px;color:var(--soft);cursor:pointer;
    list-style:none}
  .card details.why summary::-webkit-details-marker{display:none}
  .card details.why summary i{font-style:normal;color:var(--accent);
    font-family:"JetBrains Mono",monospace;font-size:11px;white-space:nowrap}
  .card details.why p{margin:8px 0 0;font-size:14px;color:var(--soft)}

  .opts{display:grid;gap:8px;padding:0 17px 14px}
  .opt{display:grid;grid-template-columns:14px minmax(0,1fr);gap:11px;text-align:left;
    border:1px solid var(--rule);border-radius:6px;background:var(--surface);
    padding:11px 13px;color:var(--ink);transition:border-color .12s,background .12s}
  .opt:hover{border-color:var(--accent)}
  .opt .dot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--dash);
    margin-top:4px}
  .opt.sel{border-color:var(--pend);background:var(--pend-soft)}
  .opt.sel .dot{border-color:var(--pend);background:var(--pend);box-shadow:inset 0 0 0 2.5px var(--pend-soft)}
  .opt .v{font-family:"JetBrains Mono",monospace;font-size:14px;font-weight:500}
  .opt .n{font-size:13px;color:var(--mute);margin-left:7px}
  .opt .c{font-size:13.5px;color:var(--soft);margin-top:3px;font-variant-numeric:tabular-nums}
  .opt.unprobed{border-style:dashed;border-color:var(--dash);background:none}
  .opt.unprobed .v{color:var(--soft)}
  .opt.unprobed .c{color:var(--mute);font-style:italic}
  .opt .flag{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--mute);border:1px solid var(--dash);
    border-radius:3px;padding:0 4px;margin-left:7px;white-space:nowrap}
  .opt .ev{margin-top:7px}
  /* the agent's draft. Deliberately not in the officer's serif: it is a
     proposal in the agent's own register, and adopting it changes the signature
     on the row — which the block says before it is adopted, not after */
  .draft{margin:0 17px 14px;border:1px solid var(--dash);border-left:3px solid var(--mute);
    border-radius:0 6px 6px 0;background:var(--sunk);padding:11px 13px}
  .draft .h{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.07em;
    text-transform:uppercase;color:var(--mute);margin-bottom:6px}
  .draft .q{font-size:14.5px;color:var(--soft);line-height:1.6}
  .draft .btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .draft .btns button{border:1px solid var(--rule);background:var(--surface);
    color:var(--soft);border-radius:6px;padding:5px 12px;font-size:13px}
  .draft .btns button:hover{border-color:var(--accent);color:var(--accent)}
  .draft .btns button.on{border-color:var(--amber);background:var(--amber-soft);
    color:var(--amber);font-weight:600}
  .draft .cost{font-size:12.5px;color:var(--amber);margin-top:9px}
  .draft.none .q{font-style:italic;color:var(--mute)}
  .sigchip{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.06em;
    padding:2px 6px;border-radius:3px;background:var(--amber-soft);color:var(--amber)}
  .sel{font:inherit;font-family:"JetBrains Mono",monospace;font-size:11px;
    padding:3px 7px;border:1px solid var(--rule);border-radius:13px;
    background:var(--sunk);color:var(--soft)}
  .wiring td:first-child{color:var(--ink)}
  .wiring td.src{font-family:"Source Sans 3",sans-serif;font-size:11.5px;color:var(--soft)}
  .wiring td.ep{color:var(--accent);font-size:10.5px}
  .wnote{font-size:12.5px;color:var(--soft);line-height:1.65;margin:14px 0 0;
    padding:10px 12px;background:var(--sunk);border-radius:6px}
  .wnote b{color:var(--ink)}
  .wnote.amber{background:var(--amber-soft);color:var(--amber)}
  .wnote.amber b{color:var(--amber)}
  .ex00{margin-top:18px;padding-top:13px;border-top:1px solid var(--rule)}
  .ex00 .cap{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--mute);margin-bottom:8px}
  .ex00 table{width:100%;border-collapse:collapse;font-size:11px}
  .ex00 th{text-align:left;font-family:"JetBrains Mono",monospace;font-size:9.5px;
    letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:500;
    border-bottom:1px solid var(--ink);padding:0 7px 4px 0}
  .ex00 td{border-bottom:1px solid var(--rule);padding:5px 7px 5px 0;vertical-align:top;
    font-family:"JetBrains Mono",monospace}
  .ex00 td.sig{color:var(--soft)}
  .ex00 td.sig.agent{color:var(--amber);font-weight:500}
  .ex00 td.rs{font-family:"Source Sans 3",sans-serif;font-size:11.5px;color:var(--mute)}
  /* The scope form is the command line, wearing a shirt. It collects exactly
     the arguments `python -m siting.cli` takes, and shows the invocation it
     amounts to, so nobody mistakes it for a step the agent performs. */
  .scope{border:1px solid var(--rule);border-radius:8px;background:var(--surface);
    padding:16px 18px;margin-bottom:20px;max-width:64ch}
  .scope h3{margin:0 0 4px;font-size:18px}
  .scope .lede{font-size:14px;color:var(--soft);margin:0 0 14px}
  .scope .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
  .scope label{display:block;font-family:"JetBrains Mono",monospace;font-size:10px;
    letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin-bottom:3px}
  .scope input,.scope select{width:100%;font:inherit;font-size:14.5px;padding:7px 10px;
    border:1px solid var(--rule);border-radius:6px;background:var(--ground);color:var(--ink)}
  .scope .wide{grid-column:1 / -1}
  .scope .cmd{grid-column:1 / -1;font-family:"JetBrains Mono",monospace;font-size:11px;
    color:var(--mute);background:var(--sunk);border-radius:5px;padding:9px 11px;
    overflow-x:auto;white-space:pre;line-height:1.6}
  .scope .go{margin-top:13px}
  .scope .go button{font-size:15px;font-weight:600;padding:10px 22px;border-radius:7px;
    border:1px solid var(--accent);background:var(--accent);color:#fff}
  .scope .go button:disabled{opacity:.35;border-color:var(--rule);background:var(--rule);
    color:var(--mute);cursor:not-allowed}
  .scope .note{font-size:12.5px;color:var(--mute);margin:10px 0 0}
  .custom{display:flex;gap:8px;align-items:center;margin-top:8px}
  .custom input{font:inherit;font-family:"JetBrains Mono",monospace;font-size:14px;
    width:120px;padding:5px 9px;border:1px solid var(--rule);border-radius:5px;
    background:var(--ground);color:var(--ink)}
  .card .foot{border-top:1px solid var(--rule);background:var(--sunk);padding:9px 17px;
    font-size:13px;color:var(--mute)}
  .card .foot b{color:var(--pend);font-weight:600}

  /* ---------- composer ---------- */
  #composer{flex:none;border-top:1px solid var(--rule);padding:11px 0 16px}
  .cue{font-size:13px;color:var(--mute);margin:0 0 8px;min-height:20px}
  .cue.armed{color:var(--pend)}
  .cue.agentcue{color:var(--amber)}
  .row{display:flex;gap:10px;align-items:flex-end}
  #say{flex:1;font:inherit;font-size:15px;padding:10px 13px;border:1px solid var(--rule);
    border-radius:7px;background:var(--surface);color:var(--ink);resize:none;height:52px}
  #say:focus{border-color:var(--accent)}
  #send{font-size:15px;font-weight:600;padding:11px 22px;border-radius:7px;
    border:1px solid var(--accent);background:var(--accent);color:#fff;flex:none}
  #send:disabled{opacity:.35;cursor:not-allowed;
    border-color:var(--rule);background:var(--rule);color:var(--mute)}

  /* ---------- right column ---------- */
  aside{border-left:1px solid var(--rule);background:var(--surface);display:flex;
    flex-direction:column;min-height:0}
  .ledger{flex:none;border-bottom:1px solid var(--rule);padding:12px 14px 10px}
  .ledger .cap{display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:9px}
  .ledger .cap span{font-family:"JetBrains Mono",monospace;font-size:10px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
  .ledger .cap em{font-style:normal;font-family:"JetBrains Mono",monospace;font-size:11px;
    color:var(--accent)}
  .lrow{display:grid;grid-template-columns:11px minmax(0,1fr) auto;gap:9px;
    align-items:baseline;padding:4px 0;font-size:12.5px}
  .lrow i{width:8px;height:8px;border-radius:50%;background:none;
    border:1.5px solid var(--dash);margin-top:5px}
  .lrow.done i{background:var(--accent);border-color:var(--accent)}
  .lrow.now i{border-color:var(--pend);background:var(--pend-soft);
    box-shadow:0 0 0 3px var(--pend-soft)}
  .lrow .k{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--mute);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lrow.done .k{color:var(--soft)}
  .lrow.now .k{color:var(--pend)}
  .lrow.agentsig .v{color:var(--amber)}
  .lrow .v{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--ink);
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .lrow.pendingrow .v{color:var(--mute)}
  .ldef{margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule)}

  .tabs{display:flex;border-bottom:1px solid var(--rule);flex:none;align-items:stretch}
  .tabs button{flex:1;background:none;border:none;color:var(--mute);
    font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.05em;
    text-transform:uppercase;padding:11px 4px;font-weight:500}
  .tabs button.on{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
  .tabs .grow{flex:none;width:36px;font-size:14px}
  #panel{flex:1;overflow:auto;padding:14px 16px}

  .empty{font-size:13.5px;color:var(--mute);line-height:1.6}
  /* the file, set as a file: keys quiet, values solid, the officer's own words
     in the serif so they read as writing rather than as data */
  .yaml{font-family:"JetBrains Mono",monospace;font-size:11.5px;line-height:1.75;
    white-space:pre-wrap;word-break:break-word}
  .yaml .c{color:var(--mute)}
  .yaml .k{color:var(--mute)}
  .yaml .v{color:var(--ink)}
  .yaml .r{font-family:"Zilla Slab","Noto Serif SC",Georgia,serif;font-size:13.5px;
    color:var(--soft);display:block;padding-left:4px;border-left:2px solid var(--accent-soft)}
  .yaml .sep{display:block;height:9px}

  .evrow{border-bottom:1px solid var(--rule);padding:9px 0}
  .evrow b{font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:500;color:var(--ink)}
  .evrow small{display:block;font-family:"JetBrains Mono",monospace;font-size:10.5px;
    color:var(--mute);margin-top:3px;word-break:break-all}

  .recon{font-size:12.5px;padding:8px 10px;border-radius:5px;margin-bottom:11px}
  .recon.ok{background:var(--accent-soft);color:var(--accent)}
  .m-svg{width:100%;height:auto;display:block;background:var(--sunk);
    border:1px solid var(--rule);border-radius:6px;margin-bottom:9px}
  .m-bound{fill:none;stroke:var(--mute);stroke-width:1;opacity:.75}
  .m-broken{fill:var(--mute);opacity:.30}
  .m-working{fill:var(--accent);opacity:.55}
  .m-halo{fill:var(--accent);opacity:.20}

/* ================= rendering ================= */

function optHTML(card, o, i){
  const T = t();
  if (o.custom){
    const on = PENDING && PENDING.custom;
    return `<button type="button" class="opt unprobed${on?" sel":""}" data-i="${i}">
      <span class="dot"></span>
      <span>
        <span class="v">${esc(T.customLabel)}</span>
        <span class="flag">${esc(o.timing === "cold" ? T.cold : T.unprobed)}</span>
      </span></button>`;
  }
  const sel = PENDING && !PENDING.custom && PENDING.value === o.value;
  const note = o.note && o.note[S()] ? `<span class="n">${esc(o.note[S()])}</span>` : "";
  // three states, not two: priced by a run, unpriced, or not a claim at all —
  // a warm budget says something about waiting, nothing about consequence
  const flag = o.timing ? `<span class="flag warm">${esc(t().warm)}</span>`
             : o.probed ? "" : `<span class="flag">${esc(t().unprobed)}</span>`;
  const ev = o.ev ? `<div class="ev full-only">${esc(JSON.stringify(o.ev, null, 1))}</div>` : "";
  return `<button type="button" class="opt${o.probed?"":" unprobed"}${sel?" sel":""} " data-i="${i}">
    <span class="dot"></span>
    <span>
      <span class="v">${esc(o.label)}${o.unit?`<span class="n">${esc(o.unit)}</span>`:""}</span>${note}${flag}
      ${o.c ? `<span class="c">${esc(o.c[S()])}</span>` : ""}
      ${ev}
    </span></button>`;
}

function cardHTML(key){
  const c = CARDS[key], T = t();
  const why = `<details class="why"${DETAIL==="full"?" open":""}>
      <summary><i>${esc(T.why)} ▾</i></summary>
      <p class="brief-only">${esc(c.whyBrief[S()])}</p>
      <p class="full-only">${esc(c.whyFull[S()])}</p>
    </details>`;
  const unpn = c.unprobedNote
    ? `<p class="c" style="font-size:13.5px;color:var(--mute);margin:0 0 11px">${esc(c.unprobedNote[S()])}</p>` : "";
  return `<div class="card" data-key="${key}">
    <div class="top">
      <div class="pos">${esc(T.pos(c.pos, 7))}${c.deferred?" · "+esc(T.deferred):""}</div>
      <h3>${esc(c.q[S()])}</h3>
      ${why}${unpn}
    </div>
    <div class="opts">${c.options.map((o,i)=>optHTML(c,o,i)).join("")}</div>
    ${PENDING && PENDING.key===key && PENDING.custom
      ? `<div class="custom" style="padding:0 17px 14px"><input id="cust" type="number"
           step="${c.unitLabel ? 1 : 50}" value="${esc(PENDING.value||"")}"
           placeholder="${c.unitLabel ? 7 : 750}"
           ><span class="n">${esc((c.unitLabel||{})[S()] || T.customUnit)}</span></div>` : ""}
    <div class="foot">${PENDING && PENDING.key===key
        ? `<b>${esc(String(PENDING.value||"—"))}</b> · ${esc(T.cue1(PENDING.value||"—"))}`
        : esc(T.cue0)}</div>
  </div>`;
}

/* The skill tells the agent to prepare the choice and recommend one. So the
   recommendation, and the reason the agent would give for it, belong in the
   agent's own turn — not in a block the interface invented. Taking it verbatim
   is allowed and is not free: the row is then signed AGENT. */
const recOf = () => {
  for (let i = THREAD.length - 1; i >= 0; i--)
    if (THREAD[i].type === "agent") return THREAD[i].rec || null;
  return null;
};
const draftActive = () => {
  const r = recOf();
  return (r && PENDING && PENDING.value === r.value) ? r.draft[S()] : null;
};
const adopted = () => {
  const d = draftActive();
  return !!d && $("say").value.trim() === d.trim();
};

function recHTML(it){
  if (!it.rec) return "";
  const T = t();
  return `<div class="draft"><div class="h">${esc(T.draftH(it.rec.value))}</div>
    <div class="q">\u201c${esc(it.rec.draft[S()])}\u201d</div>
    <div class="btns">
      <button type="button" class="dbtn" data-m="adopt">${esc(T.adopt)}</button>
      <button type="button" class="dbtn" data-m="own">${esc(T.ownWrite)}</button>
    </div>
    <div class="cost">${esc(T.adoptCost)}</div></div>`;
}

function itemHTML(it){
  const T = t();
  if (it.type === "agent"){
    const body = (DETAIL==="full" ? it.full[S()] : it.brief[S()])
      .split("\n\n").map(p=>`<p>${esc(p)}</p>`).join("");
    const tools = (it.tools||[]).length
      ? `<details class="basis"${DETAIL==="full"?" open":""}>
           <summary>${esc(T.basis)} · ${it.tools.length}</summary>
           ${it.tools.map(([n,s])=>`<div class="call"><b>✓ ${esc(n)}</b><span>${esc(s)}</span></div>`).join("")}
         </details>` : "";
    return `<div class="turn col a"><div class="who-label">${esc(T.agent)}</div>
      <div class="bub">${body}${recHTML(it)}${tools}</div></div>`;
  }
  if (it.type === "officer"){
    const meta = it.key
      ? `<div class="said-meta"><span class="vchip">${esc(it.key)} = ${esc(it.value)}</span>
         ${it.authored ? `<span class="sigchip">signed AGENT</span>`
                       : `<span class="lbl">verbatim · ${esc(it.lang)}</span>`}</div>` : "";
    const tr = it.key && !it.authored && it.lang !== LANG
      ? `<div class="tr"><b>${esc(T.trNote)}</b>${esc(T.noTrans)}</div>` : "";
    return `<div class="turn u"><div class="who-label">${esc(OFFICER || "")}</div>
      <div class="bub"><div class="verbatim">${esc(it.text)}</div>${meta}${tr}</div></div>`;
  }
  if (it.type === "record")
    return `<div class="event"><div class="h">✎ ${esc(T.recorded)}</div>
      <div class="b">${T.recordedBody(esc(it.key), esc(it.value))}</div></div>`;
  if (it.type === "opened"){
    const T = t();
    return `<div class="event"><div class="h">${esc(T.opened)}</div>
      <div class="b">${T.openedBody}</div></div>`;
  }
  if (it.type === "note")
    return `<div class="notice" style="border-color:var(--dash)">
      <div class="b">${esc(it.text)}</div></div>`;
  if (it.type === "refusal"){
    const R = {zh:{h:"这不是错误 —— 这正是系统在按设计工作",
                   b:"评估没有出具。还有两项判断没有记录，而下游任何一处都不会替它们取默认值。",
                   l:["<code>coverage_basis</code> —— 覆盖按什么衡量","<code>coverage_tolerance</code> —— 复核可以放弃多少覆盖"]},
               en:{h:"This is not an error — it is the design working",
                   b:"Not issued. Two judgements have not been recorded, and nothing downstream reads a default for them.",
                   l:["<code>coverage_basis</code> — what reach is measured as","<code>coverage_tolerance</code> — how much coverage a review may forgo"]}}[S()];
    return `<div class="notice"><div class="h">${esc(R.h)}</div>
      <div class="b">${esc(R.b)}</div><ul>${R.l.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
  }
  if (it.type === "issued"){
    const I = {zh:{h:"✓ 评估已出具",b:"<code>runs/ngara-20260902T1422Z-8c1d/</code> · 评审 7.4，在门槛之上 · 6 项判断全部由人记录"},
               en:{h:"✓ assessment issued",b:"<code>runs/ngara-20260902T1422Z-8c1d/</code> · reviewed 7.4, above the floor · all 6 judgements recorded by a person"}}[S()];
    return `<div class="event"><div class="h">${esc(I.h)}</div><div class="b">${I.b}</div></div>`;
  }
  return "";
}

function renderThread(){
  if (PHASE === "scope"){ $("thread").innerHTML = scopeHTML(); return; }
  const cur = THREAD.length && THREAD[THREAD.length-1].card;
  $("thread").innerHTML = THREAD.map(itemHTML).join("")
    + (cur ? cardHTML(cur) : "")
    + (THINKING ? `<div class="thinking">${esc(
         THINKING === true ? t().thinking : t()[THINKING])}</div>` : "");
  $("thread").scrollTop = $("thread").scrollHeight;
}

function renderLedger(){
  const T = t(), n = KEYS.filter(k=>RECORDED[k]).length;
  if (!SCOUTED){                       // six judgements is not yet a promise
    $("ledger").innerHTML = `<div class="pre">${esc(T.ledgerPre)}</div>`;
    $("cap-count").textContent = "—";
    return;
  }
  const cur = THREAD.length ? THREAD[THREAD.length-1].card : null;
  const row = k => {
    const r = RECORDED[k];
    const cls = (r ? "done" : (k===cur ? "now" : "pendingrow"))
              + (r && r.authored ? " agentsig" : "");
    const v = r ? esc(r.label[S()] || r.value) : "—";
    return `<div class="lrow ${cls}"><i></i><span class="k">${k}</span><span class="v">${v}</span></div>`;
  };
  $("ledger").innerHTML = KEYS.map(row).join("")
    + `<div class="ldef">${row(DEFERRED_KEY)}</div>`;
  $("cap-count").textContent = `${n} / 6`;
}

/* ---------- the right-hand panel ---------- */
function yamlHTML(){
  const T = t();
  if (!Object.keys(RECORDED).length) return `<p class="empty">${esc(T.emptyRecord)}</p>`;
  const head = T.yamlHead.map(l=>`<span class="c"># ${esc(l)}</span>`).join("\n");
  const body = [...KEYS, DEFERRED_KEY].filter(k=>RECORDED[k]).map(k=>{
    const r = RECORDED[k];
    let s = `<span class="k">- key:</span> <span class="v">${esc(k)}</span>\n`
          + `<span class="k">  value:</span> <span class="v">${esc(r.yamlValue||r.value)}</span>\n`
          + `<span class="k">  decided_by:</span> <span class="v">${esc(OFFICER||"")}</span>\n`
          + `<span class="k">  reason:</span> <span class="c">|</span>\n`
          + `<span class="r">    ${esc(r.reason)}</span>`;
    if (r.lang) s += `\n<span class="k">  language:</span> <span class="v">${esc(r.lang)}</span>`;
    if (r.authored) s += `\n<span class="k">  authored_by_agent:</span> <span class="v">true</span>`;
    return s;
  }).join(`<span class="sep"></span>`);
  return `<div class="yaml">${head}\n\n${body}</div>` + ex00HTML();
}

  if (!EVIDENCE.length) return `<p class="empty">${esc(t().emptyEvidence)}</p>`;
  return EVIDENCE.map(([n,s])=>`<div class="evrow"><b>✓ ${esc(n)}</b><small>${esc(s)}</small></div>`).join("");
}

/* deterministic pseudo-geography, so the map is the same on every replay */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function buildPlan(){
  const rnd = mulberry32(20260902);
  const cx = 30.66, cy = -2.48, R = 0.36;
  const ring = [];
  for (let i=0;i<72;i++){
    const a = i/72*Math.PI*2;
    const r = R*(0.72+0.28*(0.5+0.5*Math.sin(a*3+1.1))*(0.75+0.5*rnd()));
    ring.push([cx+Math.cos(a)*r*1.12, cy+Math.sin(a)*r*0.86]);
  }
  const inside = () => {
    for(;;){
      const a = rnd()*Math.PI*2, q = Math.sqrt(rnd())*R*0.82;
      const p = [cx+Math.cos(a)*q*1.12, cy+Math.sin(a)*q*0.86];
      return p;
    }
  };
  const working = [], broken = [];
  for (let i=0;i<724;i++) working.push(inside());
  for (let i=0;i<118;i++) broken.push(inside());
  const adds = [6420,5180,4390,3760,3310,2980,2640,2310,2050,1860];
  const near = [7.4,6.1,8.8,5.2,9.6,4.7,6.9,5.5,7.8,4.1];
  const why = {
    zh:["西部走廊，最近的在用水点在 7.4 公里外","三个已损坏点之间，人口密度最高的空档",
        "河东岸，雨季有六周过不去","集市所在地，周边四个村共用",
        "北部最偏远的聚居点，本方案里唯一为它设的点","学校与诊所之间，两者都无自有水源",
        "旧点已干涸，登记册仍标为在用","主路沿线，最容易维护",
        "两个乡交界，任何一边单独都排不上","最后一个点，边际收益已明显下降"],
    en:["western corridor; nearest working point is 7.4 km away","the densest gap between three broken points",
        "east bank; unreachable for six weeks in the rains","the market site, shared by four villages",
        "the most remote settlement in the north, the only site serving it","between the school and the clinic, neither with its own source",
        "the old point has dried; the register still shows it serving","on the main road, the cheapest to maintain",
        "on a ward boundary; neither ward would rank it alone","the tenth site, where marginal return has clearly fallen"]};
  const sites = adds.map((a,i)=>{
    const p = inside();
    return {id:`NG-${String(i+1).padStart(2,"0")}`, rank:i+1, lon:p[0], lat:p[1],
            add:a, near:near[i], why:{zh:why.zh[i], en:why.en[i]}};
  });
  const xs = ring.map(p=>p[0]), ys = ring.map(p=>p[1]);
  return {ring, working, broken, sites,
          bbox:[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]};
}

function mapHTML(g, W, H){
  const PAD = 8, [w,s,e,n] = g.bbox;
  const midLat = (s+n)/2*Math.PI/180;
  const dx = (e-w)*Math.cos(midLat), dy = n-s;
  const k = Math.min((W-2*PAD)/dx, (H-2*PAD)/dy);
  const offX = (W-dx*k)/2, offY = (H-dy*k)/2;
  const X = lon => (offX+(lon-w)*Math.cos(midLat)*k).toFixed(1);
  const Y = lat => (offY+(n-lat)*k).toFixed(1);
  const dots = (a,c) => a.map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="1.4" class="${c}"/>`).join("");
  const sites = g.sites.map(f=>`<g class="m-site">
      <circle cx="${X(f.lon)}" cy="${Y(f.lat)}" r="7" class="m-halo"/>
      <circle cx="${X(f.lon)}" cy="${Y(f.lat)}" r="3.6" class="m-core"/>
      <text x="${+X(f.lon)+9}" y="${+Y(f.lat)+3.5}">${f.rank}</text>
      <title>${f.id} · rank ${f.rank} · ${num(f.add)}</title></g>`).join("");
  const kmDeg = 1/(111.32*Math.cos(midLat));
  let bar = 10;
  while (kmDeg*bar*Math.cos(midLat)*k > (W-2*PAD)*0.4) bar /= 2;
  while (kmDeg*bar*Math.cos(midLat)*k < (W-2*PAD)*0.15) bar *= 2;
  const px = kmDeg*bar*Math.cos(midLat)*k;
  return `<svg viewBox="0 0 ${W} ${H}" class="m-svg" role="img"
    aria-label="${g.sites.length} recommended sites in Ngara">
    <polygon points="${g.ring.map(p=>X(p[0])+","+Y(p[1])).join(" ")}" class="m-bound"/>
    ${dots(g.broken,"m-broken")}${dots(g.working,"m-working")}${sites}
    <g class="m-scale"><line x1="${PAD}" y1="${H-PAD}" x2="${PAD+px}" y2="${H-PAD}"/>
      <line x1="${PAD}" y1="${H-PAD-3}" x2="${PAD}" y2="${H-PAD+3}"/>
      <line x1="${PAD+px}" y1="${H-PAD-3}" x2="${PAD+px}" y2="${H-PAD+3}"/>
      <text x="${PAD+px+5}" y="${H-PAD+3}">${bar} km</text></g></svg>`;
}

/* ================= flow ================= */

function pushBeat(){
  const b = BEATS[STEP];
  if (!b) return;
  if (b.refusal) THREAD.push({type:"refusal"});
  if (b.plan){ PLAN = buildPlan(); }
  THREAD.push({type:"agent", brief:b.brief, full:b.full, tools:b.tools,
               card:b.card, rec:b.rec});
  if (b.issued) THREAD.push({type:"issued"});
  EVIDENCE.push(...(b.tools||[]));
  STEP++;
}

function pick(i){
  const key = THREAD[THREAD.length-1].card;
  const c = CARDS[key], o = c.options[i];
  PENDING = o.custom ? {key, custom:true, value:""} : {key, value:o.value, label:o.note};
  $("say").value = "";
  render();
  if (o.custom){ const c = $("cust"); if (c){ c.focus();
    c.oninput = () => { PENDING.value = c.value;
                        $("cue").textContent = t().cue1(c.value||"—"); gate(); }; } }
  else $("say").focus();
  gate();
}

function gate(){
  const txt = $("say").value.trim();
  $("send").disabled = !(PENDING && PENDING.value && txt);
  const ab = document.querySelector('.dbtn[data-m="adopt"]');
  if (ab) ab.classList.toggle("on", adopted());
  updateCue();
}

function updateCue(){
  const T = t(), txt = $("say").value.trim();
  let msg = T.cue0, cls = "cue col";
  if (PENDING){
    if (adopted()){ msg = T.adoptedNow; cls += " agentcue"; }
    else if (txt && draftActive()){ msg = T.ownNow; cls += " armed"; }
    else { msg = T.cue1(PENDING.value || "—"); cls += " armed"; }
  }
  $("cue").textContent = msg;
  $("cue").className = cls;
  $("say").placeholder = PENDING ? T.ph1 : T.ph0;
}

function send(){
  if (!PENDING || !PENDING.value || !$("say").value.trim()) return;
  const key = PENDING.key, value = PENDING.value, text = $("say").value.trim();
  const card = CARDS[key];
  const opt = card.options.find(o => o.value === value);
  const authored = adopted();
  RECORDED[key] = {value, label: opt ? {zh:opt.label, en:opt.label} : {zh:value, en:value},
                   yamlValue: value, reason: text, lang: LANG, authored};
  THREAD[THREAD.length-1].card = null;
  THREAD.push({type:"officer", text, key, value, lang:LANG, authored});
  THREAD.push({type:"record", key, value});
  EVIDENCE.push(["record_decision",
    `${key} = ${value}; ${KEYS.filter(k=>RECORDED[k]).length} of 6 recorded`
    + (authored ? "; reason authored by agent, signed AGENT" : "")]);
  PENDING = null; $("say").value = ""; gate();
  THINKING = true; render();
  setTimeout(() => { THINKING = false; pushBeat(); render();
    if (THREAD[THREAD.length-1].card) $("say").focus(); }, 750);
}

function open_(){
  PHASE = "interview";
  OFFICER = SCOPE.officer.trim(); DISTRICT = SCOPE.adm2;
  FILL.add("hdr-officer"); FILL.add("hdr-place");
  THREAD.push({type:"opened"});
  THINKING = "scouting";
  render();
  setTimeout(() => {
    THINKING = false; SCOUTED = true;
    FILL.add("hdr-place"); FILL.add("hdr-boundary"); FILL.add("hdr-progress");
    pushBeat(); render(); $("say").focus();
  }, 1900);
}

function start(){
  STEP = 0; THREAD = []; EVIDENCE = []; PLAN = null; PENDING = null; THINKING = false;
  RECORDED = {};
  OFFICER = null; DISTRICT = null; SCOUTED = false; FILL.clear();
  PHASE = "scope"; SCOPE.officer = "";
  $("say").value = "";
  render();
}

/* ---------- wiring ---------- */
$("thread").addEventListener("input", e => {
  const f = e.target.dataset.f;
  if (!f) return;
  SCOPE[f] = e.target.value;
  const ok = SCOPE.country && SCOPE.adm2 && SCOPE.iso3 && SCOPE.officer.trim();
  const go = $("scope-go"); if (go) go.disabled = !ok;
  const cmd = document.querySelector(".scope .cmd");
  if (cmd) cmd.textContent = `python -m siting.cli \\\n  --country ${SCOPE.country||"…"} `
    + `--adm2 ${SCOPE.adm2||"…"} --iso3 ${SCOPE.iso3||"…"} \\\n`
    + `  --decisions sessions/<id>/decisions.yaml --format both`;
});
$("thread").addEventListener("change", e => {
  if (e.target.dataset.f) SCOPE[e.target.dataset.f] = e.target.value;
});
$("thread").addEventListener("click", e => {
  if (e.target.id === "scope-go"){ open_(); return; }
  const d = e.target.closest(".dbtn");
  if (d){
    const r = recOf();
    if (d.dataset.m === "own"){ $("say").value = ""; }
    else if (r){
      // taking the agent's words also takes the option they are a reason for
      const key = THREAD[THREAD.length-1].card;
      const i = CARDS[key].options.findIndex(o => o.value === r.value);
      if (i >= 0) pick(i);
      $("say").value = r.draft[S()];
    }
    gate(); renderThread(); $("say").focus();
    return;
  }
  const b = e.target.closest(".opt");
  if (b) pick(+b.dataset.i);
});
$("say").addEventListener("input", gate);
$("say").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); }
});
$("composer").addEventListener("submit", e => { e.preventDefault(); send(); });

$("sw-detail").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  DETAIL = b.dataset.v;
  [...$("sw-detail").children].forEach(x => x.classList.toggle("on", x === b));
  document.body.className = DETAIL;
  render();
});
$("sel-lang").addEventListener("change", e => {
  LANG = e.target.value;
  render();
});
document.querySelectorAll(".tabs button[data-tab]").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button[data-tab]").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); TAB = b.dataset.tab; renderPanel();
});
$("grow").onclick = () => {
  WIDE = !WIDE;
  document.documentElement.style.setProperty("--rail", WIDE ? "620px" : "360px");
  renderChrome(); renderPanel();
};
$("replay").onclick = start;

start();
</script>
</body>
</html>
