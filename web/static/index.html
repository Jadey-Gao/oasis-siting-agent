<!doctype html>
<!--
  The interview.

  Two things on one screen: the conversation, and the artefact it produces —
  the right rail shows the record being written and the assessments already on
  disk, never a reconstruction of either.

  Layout and visual language are ported from static/mockup.html (the frozen
  design reference — do not edit that file from here). Everything that was
  invented there is real here: no fake BEATS/CARDS, no pseudo-random map. One
  difference from the mockup worth naming: there the officer's place is
  resolved by a separate pre-flight step with its own turn type. Here it isn't
  — resolving the place is simply the agent's first conversational turn (the
  `resolve_place` tool, `web/claude.py`), rendered exactly like any other turn.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Siting interview</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ground:#F6F7F4; --surface:#FFF; --sunk:#EDF0EA;
    --ink:#1B211F; --soft:#4A544F; --mute:#78827C;
    --rule:#DCE1D9; --accent:#0F5F5C; --accent-soft:#E2EFEC;
    --amber:#9C551A; --amber-soft:#F6EADC; --flag:#8A3324;
    --pend:#7A5C12; --pend-soft:#F4EFDE; --dash:#C6CDC2;
    --rail:360px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#121614; --surface:#1A201D; --sunk:#161C19;
      --ink:#E6E9E4; --soft:#B3BCB6; --mute:#8B958E;
      --rule:#2C3532; --accent:#5CBDB5; --accent-soft:#17302E;
      --amber:#D89552; --amber-soft:#2C2318; --flag:#D9765F;
      --pend:#D6BC72; --pend-soft:#2A2617; --dash:#3B4440;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ground);color:var(--ink);
    font:16px/1.65 "Source Sans 3",-apple-system,BlinkMacSystemFont,sans-serif;
    display:flex;flex-direction:column;overflow:hidden}
  h1,h2,h3{font-family:"Zilla Slab",Georgia,serif;text-wrap:balance}
  button{font:inherit;cursor:pointer}
  a{color:var(--accent)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  .mono{font-family:"JetBrains Mono",monospace}
  .lbl{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--mute)}

  header{border-bottom:1px solid var(--rule);background:var(--surface);flex:none}
  .bar{max-width:1400px;margin:0 auto;padding:10px 20px;display:flex;gap:14px;
    align-items:center;flex-wrap:wrap}
  .who{font-family:"Zilla Slab",Georgia,serif;font-size:17px;font-weight:600}
  .sub{font-size:13.5px;color:var(--mute)}
  .spacer{flex:1}
  .slot.empty{color:var(--dash);font-weight:400}
  @keyframes fillin{from{background:var(--pend-soft);box-shadow:0 0 0 4px var(--pend-soft)}
                    to{background:none;box-shadow:none}}
  .fill{animation:fillin 1.1s ease-out}
  .chip{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.05em;
    padding:3px 9px;border-radius:11px;background:var(--sunk);color:var(--mute);white-space:nowrap}
  .chip.on{background:var(--accent-soft);color:var(--accent)}
  .chip a{color:inherit}

  .switch{display:flex;border:1px solid var(--rule);border-radius:13px;overflow:hidden;
    background:var(--sunk)}
  .switch button{border:0;background:none;color:var(--mute);padding:4px 11px;
    font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.04em}
  .switch button.on{background:var(--surface);color:var(--accent);font-weight:500;
    box-shadow:0 0 0 1px var(--rule)}
  .ghostbtn{border:1px solid var(--rule);background:var(--surface);color:var(--soft);
    border-radius:6px;padding:4px 10px;font-size:12.5px}

  main{flex:1;min-height:0;max-width:1400px;width:100%;margin:0 auto;padding:0 20px;
    display:grid;grid-template-columns:minmax(0,1fr) var(--rail);gap:0}
  .talk{display:flex;flex-direction:column;min-height:0;padding-right:26px}
  #thread{flex:1;overflow-y:auto;padding:22px 0 12px;scroll-behavior:smooth}
  .col{max-width:64ch}

  .turn{margin-bottom:20px}
  .turn.u{margin-left:auto;max-width:52ch}
  .who-label{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--mute);margin-bottom:6px}
  .bub{border:1px solid var(--rule);border-radius:7px;padding:14px 17px;background:var(--surface)}
  .turn.u .bub{background:var(--sunk);border-color:transparent}
  .bub :first-child{margin-top:0}
  .bub :last-child{margin-bottom:0}
  .bub p{margin:0 0 11px}
  .bub h2,.bub h3{font-family:"Zilla Slab",Georgia,serif;font-size:17px;margin:16px 0 7px}
  .bub ul,.bub ol{margin:0 0 11px;padding-left:20px}
  .bub li{margin-bottom:4px}
  .bub table{border-collapse:collapse;width:100%;font-size:14px;margin:0 0 12px;
    display:block;overflow-x:auto}
  .bub th{text-align:left;border-bottom:1px solid var(--ink);padding:0 12px 5px 0;
    font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);white-space:nowrap}
  .bub td{border-bottom:1px solid var(--rule);padding:6px 12px 6px 0;
    font-variant-numeric:tabular-nums}
  .bub code{font-family:"JetBrains Mono",monospace;font-size:.85em;background:var(--sunk);
    padding:1px 5px;border-radius:3px}
  .bub strong{font-weight:600}
  .verbatim{font-family:"Zilla Slab",Georgia,serif;font-size:16.5px;line-height:1.6}

  details.basis{margin-top:11px;border-top:1px dashed var(--rule);padding-top:9px}
  details.basis summary{font-family:"JetBrains Mono",monospace;font-size:11px;
    color:var(--mute);cursor:pointer;list-style:none;letter-spacing:.04em}
  details.basis summary::-webkit-details-marker{display:none}
  details.basis summary::before{content:"▸ "}
  details.basis[open] summary::before{content:"▾ "}
  .call{display:flex;gap:9px;align-items:baseline;font-family:"JetBrains Mono",monospace;
    font-size:11.5px;color:var(--mute);border-left:2px solid var(--rule);
    padding:3px 0 3px 10px;margin-top:5px}
  .call b{font-weight:500;flex:none;color:var(--soft)}
  .call.bad{border-left-color:var(--flag)}
  .call.bad b{color:var(--flag)}
  .call.run{border-left-color:var(--accent);color:var(--accent)}

  .status{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--mute);
    padding:4px 0 4px 12px;border-left:2px solid var(--accent-soft)}
  .status.err{color:var(--amber);border-left-color:var(--amber)}

  .event{border-left:3px solid var(--accent);background:var(--accent-soft);
    border-radius:0 6px 6px 0;padding:10px 14px;margin-bottom:20px;max-width:56ch}
  .event .h{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--accent);margin-bottom:4px}
  .event .b{font-size:14px;color:var(--soft)}
  .event .b code{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:var(--ink)}

  .notice{border:1px solid var(--amber);background:var(--amber-soft);border-radius:7px;
    padding:13px 16px;margin-bottom:20px;max-width:60ch}
  .notice .h{font-family:"Zilla Slab",Georgia,serif;font-weight:600;font-size:16px;
    color:var(--amber);margin-bottom:5px}
  .notice .b{font-size:14.5px;color:var(--soft)}
  .notice ul{margin:9px 0 0;padding-left:18px;font-size:14px;color:var(--soft)}
  .notice li{margin-bottom:3px}
  .notice li code{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:var(--amber)}

  /* ---------- the card ---------- */
  .card{border:1px solid var(--rule);border-radius:8px;background:var(--surface);
    margin:0 0 20px;max-width:64ch;overflow:hidden}
  .card .top{padding:14px 17px 0}
  .card .pos{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--mute);margin-bottom:5px}
  .card h3{margin:0 0 8px;font-size:19px;line-height:1.35}
  .card .why{margin:0 0 13px;font-size:14px;color:var(--soft)}
  .card .note{font-size:13.5px;color:var(--mute);margin:0 0 11px}
  .opts{display:grid;gap:8px;padding:0 17px 14px}
  .opt{display:grid;grid-template-columns:14px minmax(0,1fr);gap:11px;text-align:left;
    border:1px solid var(--rule);border-radius:6px;background:var(--surface);
    padding:11px 13px;color:var(--ink);width:100%;font:inherit;cursor:pointer;
    transition:border-color .12s,background .12s}
  .opt:hover{border-color:var(--accent)}
  .opt .dot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--dash);margin-top:4px}
  .opt.sel{border-color:var(--pend);background:var(--pend-soft)}
  .opt.sel .dot{border-color:var(--pend);background:var(--pend);
    box-shadow:inset 0 0 0 2.5px var(--pend-soft)}
  .opt .v{font-family:"JetBrains Mono",monospace;font-size:14px;font-weight:500}
  .opt .n{font-size:13px;color:var(--mute);margin-left:7px}
  .opt .c{font-size:13.5px;color:var(--soft);margin-top:3px;font-variant-numeric:tabular-nums}
  .opt.unprobed{border-style:dashed;border-color:var(--dash);background:none}
  .opt.unprobed .v{color:var(--soft)}
  .opt.unprobed .c{color:var(--mute);font-style:italic}
  .opt .flag{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--mute);border:1px solid var(--dash);
    border-radius:3px;padding:0 4px;margin-left:7px;white-space:nowrap}
  .opt .attrib{font-size:11.5px;color:var(--mute);margin-top:4px;font-style:italic}
  .card .foot{border-top:1px solid var(--rule);background:var(--sunk);padding:9px 17px;
    font-size:13px;color:var(--mute)}
  .card .foot b{color:var(--pend);font-weight:600}
  .numeric{padding:0 17px 14px}
  .numeric input{font:inherit;font-size:14px;padding:7px 11px;border:1px solid var(--rule);
    border-radius:6px;background:var(--ground);color:var(--ink);width:160px}
  .numeric .n{font-size:13px;color:var(--mute);margin-left:7px}

  /* ---------- the plan, in the thread ---------- */
  .plan{border:1px solid var(--accent);border-radius:8px;background:var(--surface);
    margin:0 0 20px;max-width:64ch;overflow:hidden}
  .plan .hd{background:var(--accent-soft);padding:12px 17px;border-bottom:1px solid var(--rule)}
  .plan .hd .h{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--accent);margin-bottom:6px}
  .plan .hd .big{font-family:"Zilla Slab",Georgia,serif;font-size:20px;font-weight:600;
    line-height:1.4;color:var(--ink)}
  .plan .hd .sub{font-size:13px;color:var(--soft);margin-top:4px}
  .plan .body{padding:14px 17px}
  .recon{font-size:12.5px;padding:7px 10px;border-radius:5px;margin-bottom:12px}
  .recon.ok{background:var(--accent-soft);color:var(--accent)}
  .recon.bad{background:var(--amber-soft);color:var(--amber)}
  .checks{margin-top:14px;border-top:1px solid var(--rule);padding-top:11px}
  .checks .h{font-size:11px;text-transform:uppercase;letter-spacing:.03em;
    color:var(--mute);margin-bottom:7px}
  .check-row{display:flex;gap:9px;align-items:baseline;font-size:12.5px;
    padding:5px 0;border-bottom:1px solid var(--rule)}
  .check-row:last-child{border-bottom:none}
  .check-row .badge{flex:none;font-size:10px;text-transform:uppercase;
    letter-spacing:.03em;padding:1px 6px;border-radius:9px;font-weight:600;
    border:1px solid currentColor}
  .check-row.pass .badge{color:var(--accent)}
  .check-row.flag .badge{color:var(--amber)}
  .check-row.reject .badge{color:var(--flag)}
  .check-row .name{flex:none;font-weight:600;min-width:15ch;color:var(--ink)}
  .check-row .detail{color:var(--soft)}
  .m-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);
    margin-bottom:10px}
  .m-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;
    margin-right:5px;vertical-align:middle}
  .m-key-site{background:var(--accent)}
  .m-key-working{background:var(--accent);opacity:.55}
  .m-key-broken{background:var(--mute);opacity:.35}
  .m-svg{width:100%;height:auto;display:block;background:var(--sunk);
    border:1px solid var(--rule);border-radius:6px;margin-bottom:12px}
  .m-bound{fill:none;stroke:var(--mute);stroke-width:1;opacity:.75}
  .m-broken{fill:var(--mute);opacity:.30}
  .m-working{fill:var(--accent);opacity:.55}
  .m-halo{fill:var(--accent);opacity:.20}
  .m-core{fill:var(--accent);stroke:var(--surface);stroke-width:1.2}
  .m-site text{font-family:"JetBrains Mono",monospace;font-size:9px;fill:var(--accent);
    font-weight:500}
  .m-scale line{stroke:var(--mute);stroke-width:1}
  .m-scale text{font-family:"JetBrains Mono",monospace;font-size:8.5px;fill:var(--mute)}
  .sites{width:100%;border-collapse:collapse;font-size:12px}
  .sites th{text-align:left;font-family:"JetBrains Mono",monospace;font-size:9.5px;
    letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:500;
    border-bottom:1px solid var(--ink);padding:0 8px 4px 0}
  .sites td{border-bottom:1px solid var(--rule);padding:6px 8px 6px 0;
    font-variant-numeric:tabular-nums;vertical-align:top;
    font-family:"JetBrains Mono",monospace}
  .sites .why td{font-family:"Source Sans 3",sans-serif;font-size:12px;color:var(--soft);
    padding-bottom:9px}
  .plan .out{border-top:1px solid var(--rule);background:var(--sunk);padding:11px 17px;
    display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px}
  .plan .out a{text-decoration:none}
  .plan .out a b{font-weight:600}
  .plan .out .hint{font-size:12px;color:var(--mute);width:100%;margin-top:2px}

  /* ---------- the scope card ---------- */
  .scope{border:1px solid var(--rule);border-radius:8px;background:var(--surface);
    padding:16px 18px;margin-bottom:20px;max-width:64ch}
  .scope h3{margin:0 0 4px;font-size:18px}
  .scope .lede{font-size:14px;color:var(--soft);margin:0 0 14px}
  .scope .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
  .scope label{display:block;font-family:"JetBrains Mono",monospace;font-size:10px;
    letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin-bottom:3px}
  .scope input,.scope select{width:100%;font:inherit;font-size:14.5px;padding:7px 10px;
    border:1px solid var(--rule);border-radius:6px;background:var(--ground);color:var(--ink)}
  .scope .wide{grid-column:1 / -1}
  .scope .go{margin-top:13px}
  .scope .go button{font-size:15px;font-weight:600;padding:10px 22px;border-radius:7px;
    border:1px solid var(--accent);background:var(--accent);color:#fff}
  .scope .go button:disabled{opacity:.35;border-color:var(--rule);background:var(--rule);
    color:var(--mute);cursor:not-allowed}
  .scope .note{font-size:12.5px;color:var(--mute);margin:10px 0 0}
  .scope .hint{font-size:12.5px;color:var(--mute);margin:-2px 0 2px;line-height:1.6}

  /* ---------- composer ---------- */
  #composer{flex:none;border-top:1px solid var(--rule);padding:11px 0 16px}
  .cue{font-size:13px;color:var(--mute);margin:0 0 8px;min-height:20px}
  .row{display:flex;gap:10px;align-items:flex-end}
  #say{flex:1;font:inherit;font-size:15px;padding:10px 13px;border:1px solid var(--rule);
    border-radius:7px;background:var(--surface);color:var(--ink);resize:vertical;
    min-height:52px;max-height:180px}
  #say:disabled{opacity:.5}
  #send{font-size:15px;font-weight:600;padding:11px 22px;border-radius:7px;
    border:1px solid var(--accent);background:var(--accent);color:#fff;flex:none}
  #send:disabled{opacity:.35;cursor:not-allowed;border-color:var(--rule);
    background:var(--rule);color:var(--mute)}

  /* ---------- right column ---------- */
  aside{border-left:1px solid var(--rule);background:var(--surface);display:flex;
    flex-direction:column;min-height:0}
  .sect{display:flex;flex-direction:column;min-height:0}
  .sect > .cap{display:flex;justify-content:space-between;align-items:baseline;
    padding:12px 14px 9px;flex:none}
  .sect > .cap span{font-family:"JetBrains Mono",monospace;font-size:10px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
  .sect > .cap em{font-style:normal;font-family:"JetBrains Mono",monospace;font-size:11px;
    color:var(--accent)}
  #s-record{flex:1;min-height:0;border-bottom:1px solid var(--rule)}
  #s-history{flex:none;min-height:0;height:38%}
  .scroll{flex:1;min-height:0;overflow-y:auto;padding:0 14px 14px}
  .pinned{flex:none;padding:0 14px 10px}
  .pinned:empty{display:none}

  .pre{font-size:12.5px;color:var(--mute);line-height:1.6}
  .lrow{display:grid;grid-template-columns:11px minmax(0,1fr) auto;gap:9px;
    align-items:baseline;padding:4px 0;font-size:12.5px}
  .lrow i{width:8px;height:8px;border-radius:50%;background:none;
    border:1.5px solid var(--dash);margin-top:5px}
  .lrow.done i{background:var(--accent);border-color:var(--accent)}
  .lrow.now i{border-color:var(--pend);background:var(--pend-soft);
    box-shadow:0 0 0 3px var(--pend-soft)}
  .lrow .k{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--mute);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lrow.done .k{color:var(--soft)}
  .lrow.now .k{color:var(--pend)}
  .lrow .v{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--ink);
    font-variant-numeric:tabular-nums;white-space:nowrap;max-width:170px;overflow:hidden;
    text-overflow:ellipsis}
  .lrow.pendingrow .v{color:var(--mute)}
  .ldef{margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule)}
  .lrow.verdict{margin-top:8px;padding-top:9px;border-top:1px solid var(--rule)}
  .lrow.verdict i{border-color:var(--accent);background:var(--accent)}
  .lrow.verdict .k{color:var(--accent)}
  .lrow.verdict .v{color:var(--accent);font-weight:500}

  .subcap{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--mute);margin:0 0 7px;
    padding-top:11px;border-top:1px solid var(--rule);
    position:sticky;top:0;background:var(--surface);z-index:1}
  .yaml{font-family:"JetBrains Mono",monospace;font-size:11.5px;line-height:1.75;
    white-space:pre-wrap;word-break:break-word}
  .yaml .c{color:var(--mute)}
  .yaml .k{color:var(--mute)}
  .yaml .v{color:var(--ink)}
  .yaml .r{font-family:"Zilla Slab",Georgia,serif;font-size:13.5px;color:var(--soft);
    display:block;padding-left:6px;border-left:2px solid var(--accent-soft)}
  .empty{font-size:13px;color:var(--mute);line-height:1.6}

  .hrow{display:block;text-decoration:none;color:inherit;padding:8px 0;
    border-bottom:1px solid var(--rule)}
  .hrow:hover .hd{color:var(--accent)}
  .hrow .hd{font-size:13.5px;font-weight:600;color:var(--ink)}
  .hrow .meta{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--mute);
    margin-top:2px;display:flex;gap:7px;flex-wrap:wrap;align-items:baseline}
  .hrow .ok{color:var(--accent)}
  .hrow .no{color:var(--flag)}

  body.brief .full-only{display:none}

  @media (max-width:1000px){
    body{overflow:auto}
    main{grid-template-columns:minmax(0,1fr)}
    .talk{padding-right:0}
    aside{border-left:none;border-top:1px solid var(--rule)}
    #s-history{max-height:none}
  }
</style>
</head>
<body class="full">

<header>
  <div class="bar">
    <span class="who slot empty" id="hdr-place">——</span>
    <span class="chip" id="hdr-iso" hidden></span>
    <span class="sub slot empty" id="hdr-officer">——</span>
    <span class="spacer"></span>
    <span class="chip" id="hdr-progress" hidden></span>
    <span class="chip" id="hdr-mode" hidden></span>
    <button class="ghostbtn" id="restart">new interview</button>
  </div>
</header>

<main>
  <section class="talk">
    <div id="thread"></div>
    <form id="composer" hidden>
      <p class="cue col" id="cue"></p>
      <div class="row col">
        <textarea id="say" rows="2" placeholder="Answer in your own words…"></textarea>
        <button id="send" type="submit">Send</button>
      </div>
    </form>
  </section>

  <aside>
    <section class="sect" id="s-record">
      <div class="cap"><span>the record</span><em id="cap-count">—</em></div>
      <div class="pinned" id="ledger"></div>
      <div class="scroll" id="record"></div>
    </section>
    <section class="sect" id="s-history">
      <div class="cap"><span>assessments on disk</span><em id="cap-hist"></em></div>
      <div class="scroll" id="history"></div>
    </section>
  </aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="/static/map.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const num = n => (n == null ? "—" : n.toLocaleString("en-US"));
const md = t => (window.marked ? marked.parse(t || "", {breaks:true}) : `<p>${esc(t||"")}</p>`);

let SID = null, STATE = null, META = null, DETAIL = "full", BUSY = false;
let HISTORY = [], CARD = null, PICKED = null, PLAN_FOR = null, GEO = null;

// What can be sited. In the real backend this is one module per entry under
// siting/domains/, read at startup (siting.cli.DOMAINS); today that is
// exactly one, so it is not worth a round trip to list it.
const DOMAINS = [{key: "water", title: "Rural water point siting"}];

const SCOPE = {where: "", domain: "water", officer: ""};

/* ================= the scope card ================= */
function scopeHTML(){
  const ok = SCOPE.where.trim() && SCOPE.officer.trim();
  return `<div class="scope">
    <h3>Open an assessment</h3>
    <p class="lede">Two things, in your own words. The place does not have to
      match how the register spells it — the agent resolves it against the
      real boundary data as its first move, and reports what it found before
      anything else runs.</p>
    <div class="grid">
      <div class="wide"><label>where</label>
        <input data-f="where" value="${esc(SCOPE.where)}"
               placeholder="Ngara, Tanzania — or however you'd say it"></div>
      <div><label>what is being sited</label>
        <select data-f="domain">${DOMAINS.map(d =>
          `<option value="${d.key}"${d.key===SCOPE.domain?" selected":""}>${esc(d.title)}</option>`
        ).join("")}</select></div>
      <div><label>your name and role</label>
        <input data-f="officer" value="${esc(SCOPE.officer)}"
               placeholder="District Water Officer, Ngara"></div>
    </div>
    <div class="go"><button id="scope-go" type="button"${ok?"":" disabled"}>Begin</button></div>
    <p class="note">Your name is the one thing that has to be exactly right:
      every judgement is recorded against it. If the place resolves to
      somewhere you didn't mean, say so in the conversation and it is
      corrected — that's a sentence, not a form.</p>
  </div>`;
}

/* ================= the card ================= */
function optHTML(o, i){
  const note = o.note ? `<span class="n">${esc(o.note)}</span>` : "";
  const flag = o.probed ? "" : `<span class="flag">not probed</span>`;
  const ev = (o.probed && o.evidence && Object.keys(o.evidence).length)
    ? `<div class="attrib full-only">${esc(JSON.stringify(o.evidence))}</div>` : "";
  const attrib = o.attribution
    ? `<div class="attrib full-only">${esc(o.attribution)}</div>` : "";
  return `<button type="button" class="opt${o.probed?"":" unprobed"}" data-i="${i}">
    <span class="dot"></span><span>
      <span class="v">${esc(o.label)}</span>${note}${flag}
      ${o.consequence ? `<span class="c">${esc(o.consequence)}</span>` : ""}${ev}${attrib}
    </span></button>`;
}

function cardHTML(c){
  const opts = c.options && c.options.length
    ? `<div class="opts">${c.options.map(optHTML).join("")}</div>` : "";
  const numericInput = (c.numeric && !c.options.length)
    ? `<div class="numeric"><input id="cust" type="number" placeholder="a number"
         >${c.unit ? `<span class="n">${esc(c.unit)}</span>` : ""}</div>` : "";
  return `<div class="card" data-key="${c.key}">
    <div class="top">
      <div class="pos">decision ${c.position} of 7${c.deferred?" · asked once a plan exists":""}</div>
      <h3>${esc(c.question)}</h3>
      <p class="why">${esc(c.why_not_a_default)}</p>
      ${c.warning ? `<p class="note">${esc(c.warning)}</p>` : ""}
    </div>
    ${opts}${numericInput}
    <div class="foot">${PICKED
      ? `<b>${esc(c.key)} = ${esc(String(PICKED.value))}</b> — add a reason in the
         box below, or send as it is and the agent will ask for one.`
      : `Pick an option or type a number above if there is one, then write your
         reason below. What you write is recorded verbatim as the reason.`}</div>
  </div>`;
}

/* The guardrail checks — equity, aggregation sensitivity, boundary exposure,
   cartographic consistency and the rest — exactly the list siting/exhibits.py
   renders into the PDF. A map-reviewer verdict, once attached, arrives here
   as the "cartographic consistency" row; it gets no panel of its own. */
function evaluationHTML(evaluation){
  if (!evaluation || !evaluation.length) return "";
  const rows = evaluation.map(c => `<div class="check-row ${esc(c.level)}">
      <span class="badge">${esc(c.level)}</span>
      <span class="name">${esc(c.check)}</span>
      <span class="detail">${esc(c.detail)}</span>
    </div>`).join("");
  return `<div class="checks"><div class="h">guardrail checks</div>${rows}</div>`;
}

/* ================= the plan, in the thread ================= */
function planHTML(state, geo){
  const g = state.review;
  const bad = geo.checks.filter(c => !c.reconciles);
  const recon = bad.length
    ? `<div class="recon bad">${bad.map(c => esc(c.note)).join(" ")}</div>`
    : `<div class="recon ok">Map and account reconcile: ${esc(
         (geo.checks.find(c => c.layer === "points") || {}).note || "")}</div>`;
  const rows = geo.table.map(r => `<tr>
      <td><b>${esc(r.id)}</b></td>
      <td>${r.lat.toFixed(4)}<br>${r.lon.toFixed(4)}</td>
      <td>${num(r.newly_covered)}</td>
      <td>${r.nearest_working_m == null ? "—" : (r.nearest_working_m/1000).toFixed(1) + " km"}</td></tr>
    <tr class="why full-only"><td></td><td colspan="3">${esc(r.rationale || "")}</td></tr>`).join("");
  const runId = state.last_run.run_dir.split("/").pop();
  const verdict = g ? `reviewed ${g.weighted}, ${g.weighted >= g.accept_at ? "above" : "below"}
    the floor of ${g.accept_at} · ${g.decision === "issue" ? "issued" : "not issued"}` : "";
  return `<div class="plan">
    <div class="hd">
      <div class="h">${g && g.decision === "issue" ? "✓ assessment issued" : "assessment run"}</div>
      <div class="big">${geo.table.length} site${geo.table.length===1?"":"s"} recommended</div>
      <div class="sub">${verdict} · <code class="mono">${esc(runId)}</code></div>
    </div>
    <div class="body">
      ${recon}
      ${planLegend(geo)}
      ${planMap(geo, {width: 640, height: 300})}
      <table class="sites"><thead><tr>
        <th>site</th><th>coordinates</th><th>newly<br>covered</th>
        <th>to nearest<br>working</th></tr></thead><tbody>${rows}</tbody></table>
      ${evaluationHTML(state.evaluation)}
    </div>
    <div class="out">
      <a href="/api/interview/${SID}/document/assessment" target="_blank"><b>Assessment PDF ↗</b></a>
      <a href="/api/interview/${SID}/document/bundle" target="_blank">Evidence bundle ↗</a>
      <a href="/api/interview/${SID}/record" target="_blank">Run record ↗</a>
      ${geo.plan_image ? `<a href="${geo.plan_image}" target="_blank" download>Plan map (PNG) ↗</a>` : ""}
      ${geo.population_image ? `<a href="${geo.population_image}" target="_blank" download>Situation map (PNG) ↗</a>` : ""}
      ${geo.framework_image ? `<a href="${geo.framework_image}" target="_blank" download>Framework figure (PNG) ↗</a>` : ""}
      <span class="hint">The run record carries every site, the five review
        dimensions, the anomalies and every retrieval. Open it before the PDF.</span>
    </div>
  </div>`;
}

/* ================= right column ================= */
const KEYS = ["budget","data_currency_accepted","service_radius_m","coverage_basis",
             "objective","coverage_tolerance"];
const DEFERRED_KEY = "equity_accepted";

function ledgerHTML(){
  if (!STATE || !STATE.resolved)
    return `<p class="pre">The place has not been resolved yet — the agent
      checks it against the real boundary register before anything else runs,
      and the record starts filling in once that's done.</p>`;
  const rec = STATE.recorded;
  const next = STATE.progress.outstanding[0]
    || (STATE.last_run ? STATE.progress.deferred_outstanding[0] : null);
  const row = k => {
    const r = rec[k];
    const cls = r ? "done" : (k === next ? "now" : "pendingrow");
    return `<div class="lrow ${cls}"><i></i><span class="k">${k}</span>
      <span class="v" title="${r?esc(String(r.value)):''}">${r ? esc(String(r.value)) : "—"}</span></div>`;
  };
  const verdict = STATE.review
    ? `<div class="lrow verdict"><i></i><span class="k">review</span>
       <span class="v">${STATE.review.weighted} · ${STATE.review.decision === "issue" ? "issued" : "revise"}</span></div>`
    : "";
  return KEYS.map(row).join("") + `<div class="ldef">${row(DEFERRED_KEY)}</div>` + verdict;
}

function recordHTML(){
  if (!STATE || !STATE.resolved) return "";
  return `<div class="subcap">decisions.yaml</div>` + yamlHTML();
}

// Colouring applied to the literal file on disk (`state.decisions_yaml`), never
// a reconstruction of it — this panel exists to show the file the run will
// actually read.
function tint(text){
  return esc(text).split("\n").map(line => {
    if (/^\s*#/.test(line)) return `<span class="c">${line}</span>`;
    const m = line.match(/^(\s*-?\s*)([a-z_]+):(.*)$/);
    if (m) return `${m[1]}<span class="k">${m[2]}:</span><span class="v">${m[3]}</span>`;
    if (/^\s{4}\S/.test(line)) return `<span class="r">${line.trim()}</span>`;
    return line;
  }).join("\n");
}

function yamlHTML(){
  const text = STATE.decisions_yaml;
  if (!text)
    return `<p class="empty">Nothing recorded yet. Each answer is written here
      as it is made — this file, not the conversation, is what the assessment
      reads.</p>`;
  return `<div class="yaml">${tint(text)}</div>`;
}

function historyHTML(){
  if (!HISTORY.length)
    return `<p class="empty">Nothing on disk yet.</p>`;
  return HISTORY.map(h => `<div class="hrow" data-sid="${esc(h.session_id)}"
      role="button" tabindex="0">
    <div class="hd">${esc(h.district)}</div>
    <div class="meta">
      <span>${esc((h.created || "").slice(0,10) || "—")}</span>
      ${h.sites != null ? `<span>${h.sites} sites</span>` : ""}
      ${h.issued ? `<span class="ok">✓ ${h.score ?? ""}</span>` : `<span class="no">not issued</span>`}
    </div></div>`).join("");
}

/* ================= chrome ================= */
function renderChrome(){
  document.body.className = DETAIL;
  const place = $("hdr-place");
  const iso = $("hdr-iso");
  if (STATE && STATE.resolved){
    place.textContent = `${STATE.scope.adm2}, ${STATE.scope.country}`;
    place.className = "who";
    iso.hidden = false; iso.textContent = STATE.scope.iso3;
  } else if (STATE){
    place.textContent = "resolving…";
    place.className = "who slot";
    iso.hidden = true;
  } else {
    place.textContent = "——"; place.className = "who slot empty"; iso.hidden = true;
  }

  const off = $("hdr-officer");
  off.textContent = STATE ? STATE.officer : "——";
  off.className = "sub slot" + (STATE ? "" : " empty");

  const pr = $("hdr-progress");
  pr.hidden = !STATE;
  if (STATE){ pr.className = "chip" + (STATE.progress.recorded ? " on" : "");
    pr.textContent = STATE.progress.statement; }

  const mo = $("hdr-mode");
  mo.hidden = !STATE;
  if (STATE) mo.textContent = "agent";

  $("cap-count").textContent = STATE && STATE.resolved ? STATE.progress.statement : "—";
  $("cap-hist").textContent = String(HISTORY.length);
  $("composer").hidden = !SID;
}

/* render() draws the settled state: chrome, the scope card (before an
   interview exists), the ledger, and history. It never touches #thread once
   an interview is open — the turns are appended to it incrementally, by
   runTurn, officerSaid and maybeShowPlan, as they happen. Reassigning
   #thread's innerHTML from here would rebuild every node the SSE loop is
   still holding a live reference to. */
function render(){
  renderChrome();
  if (!SID) $("thread").innerHTML = scopeHTML();
  $("ledger").innerHTML = ledgerHTML();
  $("record").innerHTML = recordHTML();
  $("history").innerHTML = historyHTML();
}

/* ================= the card, live ================= */
// The card is keyed to whatever `key` the agent itself declared this turn via
// `present_options` — never guessed from a fixed question order, which the
// agent does not follow. No key this turn means no card: showing nothing is
// always safer than showing one for the wrong decision.
async function showCard(key){
  CARD = null; PICKED = null; AUTO_FILL = "";
  const old = document.getElementById("live-card");
  if (old) old.remove();
  if (!key){ gate(); return; }
  const res = await fetch(`/api/interview/${SID}/card/${encodeURIComponent(key)}`);
  if (res.ok) CARD = await res.json();
  if (CARD){
    const div = document.createElement("div");
    div.id = "live-card";
    div.innerHTML = cardHTML(CARD);
    $("thread").appendChild(div);
    scroll();
  }
  gate();
}

function flashComposer(){
  const say = $("say");
  say.classList.remove("fill"); void say.offsetWidth; say.classList.add("fill");
}

// The label text pick() itself last inserted, so switching the selection can
// safely replace it — but never touches anything the officer actually typed.
let AUTO_FILL = "";

function pick(i){
  const o = CARD.options[i];
  PICKED = {key: CARD.key, value: o.value};
  document.querySelectorAll(".opt").forEach((el, j) => el.classList.toggle("sel", j === i));
  const old = document.getElementById("live-card");
  if (old) old.querySelector(".foot").outerHTML =
    `<div class="foot"><b>${esc(CARD.key)} = ${esc(String(o.value))}</b> — now write
     why, in the box below, and send. That's what gets recorded as the reason.</div>`;
  const say = $("say");
  if (!say.value.trim() || say.value === AUTO_FILL){
    AUTO_FILL = String(o.label) + " ";
    say.value = AUTO_FILL;
  }
  say.focus(); say.setSelectionRange(say.value.length, say.value.length);
  flashComposer();
  gate();
}

/* ================= thread items (non-streaming) ================= */
function scroll(){ const t = $("thread"); t.scrollTop = t.scrollHeight; }

function turnEl(who, cls){
  const d = document.createElement("div");
  d.className = "turn " + cls;
  d.innerHTML = `<div class="who-label">${esc(who)}</div><div class="bub"></div>`;
  $("thread").appendChild(d);
  scroll();
  return d;
}

function officerSaid(text){
  const el = turnEl(STATE.officer, "u");
  el.querySelector(".bub").innerHTML = `<div class="verbatim">${esc(text)
    || "<em style='color:var(--mute)'>(no reason given)</em>"}</div>`;
  scroll();
}

/* ================= one agent turn, streamed ================= */
async function runTurn(text){
  BUSY = true; gate();
  const res = await fetch(`/api/interview/${SID}/say`, {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({text: text || ""})});
  if (!res.ok){ note((await res.json()).detail, true); BUSY = false; gate(); return; }
  const {turn} = await res.json();
  const n = turn.split(":")[1];

  const el = turnEl("agent", "a");
  const bub = el.querySelector(".bub");
  const basis = document.createElement("details");
  basis.className = "basis"; basis.hidden = true; basis.open = (DETAIL === "full");
  basis.innerHTML = `<summary>tools used · <span class="n">0</span></summary>`;
  bub.appendChild(basis);
  const callCount = basis.querySelector(".n");
  const status = document.createElement("div");
  status.className = "status";
  bub.appendChild(status);
  const t0 = Date.now();
  const tick = setInterval(() => {
    if (status.dataset.msg) status.textContent =
      `${status.dataset.msg} · ${Math.round((Date.now()-t0)/1000)}s`;
  }, 500);
  const setStatus = m => { status.dataset.msg = m; status.textContent = m; };
  setStatus("thinking");

  // Which decision (if any) the agent itself declared it is asking about this
  // turn, via present_options — the only thing that decides whether a card
  // shows, and which one.
  let presentedKey = null;

  await new Promise(resolve => {
    const src = new EventSource(`/api/interview/${SID}/turn/${n}`);
    src.onmessage = m => {
      const ev = JSON.parse(m.data);
      if (ev.kind === "thinking") setStatus("thinking");
      if (ev.kind === "tool"){
        setStatus(`${ev.name}…`);
        basis.hidden = false;
        const row = document.createElement("div");
        row.className = "call run";
        row.innerHTML = `<b>${esc(ev.name)}</b><span>running…</span>`;
        basis.appendChild(row);
        callCount.textContent = basis.querySelectorAll(".call").length;
        scroll();
      }
      if (ev.kind === "tool_done"){
        if (ev.name === "present_options" && ev.ok && ev.input && ev.input.key)
          presentedKey = ev.input.key;
        const rows = basis.querySelectorAll(".call");
        const row = rows[rows.length - 1];
        row.className = "call" + (ev.ok ? "" : " bad");
        row.innerHTML = `<b>${ev.ok ? "✓" : "✗"} ${esc(ev.name)}</b>`
                      + `<span>${esc(ev.summary || "")}</span>`;
        scroll();
      }
      if (ev.kind === "said"){
        clearInterval(tick); status.remove();
        const body = document.createElement("div");
        body.innerHTML = md(ev.text || "");
        bub.insertBefore(body, basis);
        scroll();
      }
      if (ev.kind === "unavailable"){
        clearInterval(tick);
        status.className = "status err";
        status.textContent = ev.text;
      }
      if (ev.kind === "state"){
        STATE = ev.state;
      }
    };
    src.onerror = () => { src.close(); clearInterval(tick); resolve(); };
    const poll = setInterval(() => {
      if (src.readyState === 2){ clearInterval(poll); resolve(); }
    }, 200);
  });

  render();
  await maybeShowPlan();        // sequential and in this order: the plan, if
  await showCard(presentedKey); // any, belongs above the next question
  BUSY = false; gate(); $("say").focus();
}

function note(text, bad){
  const d = document.createElement("div");
  d.className = "status" + (bad ? " err" : "");
  d.textContent = text; $("thread").appendChild(d); scroll();
}

/* The plan appears once, the turn after run_assessment succeeds — detected
   by a new last_run.run_dir the thread hasn't shown yet, never by guessing
   from the agent's prose. */
async function maybeShowPlan(){
  if (!STATE || !STATE.last_run || STATE.last_run.run_dir === PLAN_FOR) return;
  const res = await fetch(`/api/interview/${SID}/geo`);
  if (!res.ok) return;
  GEO = await res.json();
  PLAN_FOR = STATE.last_run.run_dir;
  const div = document.createElement("div");
  div.innerHTML = planHTML(STATE, GEO);
  $("thread").appendChild(div);
  scroll();
  await loadHistory();   // a run just landed on disk; the sidebar should say so
}

/* ================= composer gating ================= */
function gate(){
  const say = $("say");
  say.disabled = BUSY;
  $("send").disabled = BUSY || !(say.value.trim() || (PICKED && PICKED.value));
  const txt = say.value.trim();
  let msg;
  if (PICKED && txt) msg = `${PICKED.key} = ${PICKED.value}, with your words as the reason. Both go into the record.`;
  else if (PICKED) msg = `${PICKED.key} = ${PICKED.value} selected, with no reason yet. Send it and the agent will ask for one.`;
  else if (txt) msg = "Sent verbatim. Nothing you write is edited, summarised or translated before it is recorded.";
  else msg = BUSY ? "the agent is working…" : "Answer in your own words.";
  $("cue").textContent = msg;
}

async function send(){
  const text = $("say").value.trim();
  if (!text || BUSY) return;
  $("say").value = "";
  AUTO_FILL = "";
  const old = document.getElementById("live-card");
  if (old) old.remove();
  officerSaid(text);
  PICKED = null;
  await runTurn(text);
}

/* ================= open an interview ================= */
async function begin(){
  const officer = SCOPE.officer.trim();
  const where = SCOPE.where.trim();
  if (!officer || !where) return;
  $("scope-go").disabled = true;
  const res = await fetch("/api/interview", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({where, domain: SCOPE.domain, officer})});
  if (!res.ok){ $("scope-go").disabled = false; alert((await res.json()).detail); return; }
  META = await res.json(); STATE = META; SID = META.id;
  $("thread").innerHTML = "";
  render();
  await runTurn("");             // the agent opens: resolves the place, then scouts
}

async function loadHistory(){
  const res = await fetch("/api/runs");
  if (res.ok) HISTORY = await res.json();
  render();
}

/* Reopening a past interview replays its transcript verbatim from
   `session.json` — the same file that drives the live page, read back rather
   than reconstructed. It is not a read-only viewer: the session can still be
   continued, exactly as if the tab had just been closed and reopened. */
async function openHistoricSession(sid){
  if (BUSY) return;
  if (SID && SID !== sid && !confirm(
      "Open this earlier assessment? The current interview stays on disk; " +
      "you can come back to it from the history list.")) return;
  const res = await fetch(`/api/interview/${sid}`);
  if (!res.ok){ alert("could not open that interview"); return; }
  STATE = await res.json();
  SID = sid; CARD = null; PICKED = null; AUTO_FILL = ""; PLAN_FOR = null; GEO = null;
  $("thread").innerHTML = "";
  for (const u of STATE.transcript){
    if (u.speaker === "officer"){
      officerSaid(u.text);
    } else {
      const el = turnEl("agent", "a");
      el.querySelector(".bub").innerHTML = md(u.text || "");
    }
  }
  render();
  await maybeShowPlan();
  // No card: that only ever comes from `present_options` on a live turn, and
  // replaying a transcript doesn't re-run the agent. The officer's next
  // message starts a real turn, same as ever.
  $("say").focus();
}

function restart(){
  SID = null; STATE = null; META = null; CARD = null; PICKED = null;
  PLAN_FOR = null; GEO = null;
  SCOPE.where = ""; SCOPE.officer = ""; SCOPE.domain = "water";
  render();
}

/* ================= wiring ================= */
$("thread").addEventListener("input", e => {
  const f = e.target.dataset.f;
  if (f){
    SCOPE[f] = e.target.value;
    const go = $("scope-go");
    if (go) go.disabled = !(SCOPE.where.trim() && SCOPE.officer.trim());
    return;
  }
  if (e.target.id === "cust" && CARD){
    PICKED = e.target.value.trim() ? {key: CARD.key, value: e.target.value.trim()} : null;
    gate();
  }
});
$("thread").addEventListener("change", e => {
  if (e.target.dataset.f === "domain") SCOPE.domain = e.target.value;
});
$("thread").addEventListener("click", e => {
  if (e.target.id === "scope-go"){ begin(); return; }
  const b = e.target.closest(".opt");
  if (b) pick(+b.dataset.i);
});
$("say").addEventListener("input", gate);
$("say").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});
$("composer").addEventListener("submit", e => { e.preventDefault(); send(); });

$("history").addEventListener("click", e => {
  const row = e.target.closest(".hrow");
  if (row && row.dataset.sid) openHistoricSession(row.dataset.sid);
});
$("history").addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const row = e.target.closest(".hrow");
  if (row && row.dataset.sid){ e.preventDefault(); openHistoricSession(row.dataset.sid); }
});
$("restart").addEventListener("click", () => {
  if (SID && !confirm("Start a new interview? This one stays on disk; you can reopen it later.")) return;
  restart();
});

loadHistory();
render();
</script>
</body>
</html>
